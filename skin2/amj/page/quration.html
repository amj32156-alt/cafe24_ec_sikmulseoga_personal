    <section id="step-result" class="d-none">
        <h2>분석 완료!</h2>
        <div id="result-display"></div>
    </section>
</div>


<script>



let currentStep = 0;
// DOM 로드 후 전체 스텝 수를 자동으로 계산
const totalSteps = document.querySelectorAll("#step_quration_wrapper > section").length;


// 1. 시작 버튼 클릭
document.querySelector('#previewinfo .btn-next').addEventListener('click', () => {
    document.getElementById('previewinfo').style.display = 'none';
    document.querySelector('.quration_slide_wrapper').classList.remove('d-none');
    // 초기화 및 프로그레스 바 적용
    currentStep = 1;
    updateUI(); 
    console.log(currentStep,totalSteps )
});

// 2. 다음/이전 버튼 이벤트
document.querySelector('.quration_slide_wrapper .btn-next').addEventListener('click', () => {
    if (currentStep < totalSteps) {
        currentStep++;
        updateUI(currentStep);
    } else {
        // 마지막 단계 완료 처리
        showResult();
    }
});

document.querySelector('.quration_slide_wrapper .btn-prev').addEventListener('click', () => {
    if (currentStep > 1) {
        currentStep--;
        updateUI(currentStep);
    }
});

// 3. UI 통합 업데이트 함수
function updateUI(currentStep) {
    // 슬라이드 애니메이션 (translateX)
    const wrapper = document.getElementById('step_quration_wrapper');
    wrapper.style.transform = `translateX(-${( currentStep - 1 ) * 100}%)`;

    console.log('나 ui안에 있어',currentStep, typeof(currentStep))
    // 프로그레스 바 업데이트
    updateProgressBar(currentStep, totalSteps);
}

function updateProgressBar(currentStep, totalSteps) {
    const progress = (currentStep / totalSteps) * 100 + "%";
    const bar = document.querySelector('.scroll_bar .bg-white');
    
    bar.setAttribute('data-width', progress); // 필수 요구사항
    bar.style.setProperty('--progress', progress); // CSS 연동
}

function showResult() {
    // 결과 화면 로직
    document.body.setAttribute('data-page-id', 'quration_result');
    // ... 나머지 결과 노출 로직
}

// 답변 데이터 저장용 객체
const surveyData = {};

// 답변 버튼 클릭 이벤트
document.querySelectorAll('.answer_btns button').forEach(btn => {
    btn.addEventListener('click', (e) => {
        const currentBtn = e.target;
        const parent = currentBtn.closest('.answer_btns');
        
        // 1. 해당 질문 그룹 내의 모든 버튼에서 is-selected 제거 (하나만 선택 보장)
        parent.querySelectorAll('button').forEach(b => b.classList.remove('is-selected'));
        
        // 2. 클릭한 버튼에 is-selected 추가
        currentBtn.classList.add('is-selected');
        
        // 3. 텍스트 수집 (질문 번호별로 저장)
        const stepId = currentBtn.closest('.slide-step').id; // 예: "step-1"
        surveyData[stepId] = currentBtn.innerText.trim();
        
        console.log("현재 수집된 데이터:", surveyData);
    });
});


// 2. 초기 상태 설정 (CSS 혹은 JS로 초기 숨김)
// HTML의 .quration_slide_wrapper와 #step-contraller에 d-none 클래스를 추가해두세요.

</script>
